<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameX — Full-Scale Official Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0b0b;
      --accent-red: #e50914;
      --panel-color: #141414;
      --border-color: #262626;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
    }

    .view-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .view-container.active {
      display: flex;
      flex-direction: column;
      opacity: 1;
    }

    /* 1. Welcome Page */
    #welcome-view {
      justify-content: center;
      align-items: center;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.92)),
                  url('https://images.alphacoders.com/438/438092.jpg') center/cover no-repeat;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }

    .welcome-content {
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.8s ease;
    }

    .logo-img {
      width: 100%;
      max-width: 420px;
      height: auto;
      object-fit: contain;
      margin-bottom: 30px;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8));
    }

    .enter-btn {
      padding: 16px 55px;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #fff;
      background: var(--accent-red);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(229, 9, 20, 0.5);
      transition: all 0.25s ease;
    }

    .enter-btn:hover {
      background: #f40612;
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(229, 9, 20, 0.7);
    }

    /* 2. Ad-Blocker Enabler Screen */
    #adblock-enabler-view {
      justify-content: center;
      align-items: center;
      background: #0d0d10;
      text-align: center;
      padding: 24px;
      z-index: 15;
    }

    .enabler-box {
      background: var(--panel-color);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--accent-red);
      padding: 45px 35px;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      animation: fadeIn 0.4s ease;
    }

    .enabler-box h2 {
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .enabler-box p {
      font-size: 0.82rem;
      color: #999;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .enable-extension-btn {
      background: #2ecc71;
      color: #000;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .enable-extension-btn:hover {
      background: #27ae60;
      transform: translateY(-1px);
    }

    /* 3. Full-Scale Official Stream View */
    #stream-view {
      background: #000;
      position: relative;
      width: 100%;
      height: 100%;
    }

    #stream-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 1. Welcome Page -->
  <div id="welcome-view" class="view-container active">
    <div class="welcome-content">
      <img src="https://cdn2.downdetector.com/static/uploads/logo/gta-v-logo-huge-transback1.png" alt="GameX Logo" class="logo-img">
      <button class="enter-btn" onclick="goToAdBlockerPrompt()">ENTER</button>
    </div>
  </div>

  <!-- 2. Ad-Blocker Extension Enabler Screen -->
  <div id="adblock-enabler-view" class="view-container">
    <div class="enabler-box">
      <h2>Ad-Blocker Protection</h2>
      <p>Aapki game stream ko ads aur popups se bachane ke liye free Ad-Blocker extension ko enable karna zaroori hai.</p>
      <button class="enable-extension-btn" onclick="enableAdBlockerAndLaunch()">Enable Ad-Blocker & Launch</button>
    </div>
  </div>

  <!-- 3. Final Full-Scale Stream View -->
  <div id="stream-view" class="view-container">
    <iframe id="stream-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals" allow="autoplay; fullscreen; encrypted-media; pointer-lock" allowfullscreen></iframe>
  </div>

  <script>
    function goToAdBlockerPrompt() {
      document.getElementById('welcome-view').classList.remove('active');
      document.getElementById('adblock-enabler-view').classList.add('active');
    }

    function enableAdBlockerAndLaunch() {
      document.getElementById('adblock-enabler-view').classList.remove('active');
      document.getElementById('stream-view').classList.add('active');

      const frame = document.getElementById('stream-frame');
      const targetUrl = 'https://gta.deloskiyt.pl/';
      
      if (!frame.src) {
        frame.src = targetUrl;
      }
    }

    function returnWelcome() {
      document.getElementById('stream-view').classList.remove('active');
      document.getElementById('welcome-view').classList.add('active');
      document.getElementById('stream-frame').src = '';
    }

    // COOP/COEP isolation property spoofing & Secret Exit (111) handler
    let keySequence = '';
    let sequenceTimeout = null;

    window.addEventListener('keydown', (e) => {
      // 111 dabane par exit karne ke liye
      if (document.getElementById('stream-view').classList.contains('active')) {
        if (e.key === '1') {
          keySequence += '1';
          if (keySequence === '111') {
            keySequence = '';
            returnWelcome();
          }
          clearTimeout(sequenceTimeout);
          sequenceTimeout = setTimeout(() => { keySequence = ''; }, 1500);
        } else {
          keySequence = '';
        }
      }
    });

    // Cross-origin isolation property mock injection taaki game ko isolated environment lage
    if (window.crossOriginIsolated === false) {
      try {
        Object.defineProperty(window, 'crossOriginIsolated', {
          value: true,
          configurable: true,
          writable: true
        });
      } catch (err) {}
    }
  </script>
</body>
</html>
